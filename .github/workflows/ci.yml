name: CI

# Every push and every pull request. The Pages workflow also runs these checks,
# but only on `main` and only as a gate on deploying — which leaves a branch
# and a pull request with no signal at all until the moment they land.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch: a push that supersedes another makes the older run's
  # answer irrelevant, so cancel it rather than paying for both.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # Catches a break that only the production build sees — a type-only
      # import that survives `tsc -b`, or a `dts` failure — which would
      # otherwise surface for the first time during a release.
      - name: Build
        run: pnpm run build
